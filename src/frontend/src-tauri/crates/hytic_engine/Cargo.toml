[package]
name = "hytic_engine"
version = "0.1.0"
description = "Native GPU image grading and rendering engine for Hytic"
edition = "2024"

[dependencies]
wgpu = "24"
bytemuck = { version = "1.21", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
pollster = "0.4"
